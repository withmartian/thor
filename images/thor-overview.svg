<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1348" width="1320" height="1348" role="img" aria-labelledby="t d">
  <title id="t">thor document flow</title>
  <desc id="d">Three bands. HYPOTHESIS: the human and the agent keep separate conjecture files and jointly rank a next-steps agenda. EXECUTE: the agent runs ten to a hundred pre-registered studies and maintains a trio of empirical results documents, while the human reviews at the gates; step five reflects results back into the belief files. FOUNDATION: three coordinated project-wide documents, set up once and re-read at every session start. Throughout, the left column is human work and the right column is agent work.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#98A0AE"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#98A0AE"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0B7C3"/>
    </marker>
  </defs>

  <style>
    .s  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .h1 { font-size: 23px; font-weight: 700; fill: #14161C; letter-spacing: .2px; }
    .sub{ font-size: 14.5px; fill: #5C6474; }
    .lg { font-size: 13.5px; fill: #5C6474; }
    .lgn{ font-size: 13px; fill: #8A91A0; }
    .bnd{ font-size: 17px; font-weight: 700; letter-spacing: 2.2px; fill: #14161C; }
    .bwh{ font-size: 13.5px; fill: #7A8290; }
    .tag{ font-size: 12.5px; font-weight: 700; letter-spacing: 1.05px; }
    .ttl{ font-size: 16px; font-weight: 600; fill: #14161C; }
    .fn { font-size: 13.5px; }
    .cap{ font-size: 14px; fill: #5C6474; }
    .bul{ font-size: 14px; fill: #3D4352; }
    .lane{ font-size: 14px; font-weight: 700; letter-spacing: .9px; fill: #FFFFFF; }
    .grp{ font-size: 13px; font-weight: 700; letter-spacing: 1.05px; fill: #5C6474; }
    .ph { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; fill: #8A91A0; }
    .phn{ font-size: 30px; font-weight: 700; fill: #D3D7E0; }
    .bdg{ font-size: 14px; font-weight: 700; letter-spacing: .6px; fill: #FFFFFF; }
  </style>

  <!-- page -->
  <rect x="6" y="6" width="1308" height="1336" rx="20" fill="#FFFFFF" stroke="#E6E8EE"/>

  <!-- ── header ───────────────────────────────────────────────────────────── -->
  <text class="s h1" x="52" y="74">thor · process flow</text>
  <text class="s sub" x="52" y="101">Human manages. Agent executes. All durable state lives in version-controlled Markdown.</text>
  <g>
    <rect x="926" y="57" width="14" height="14" rx="3" fill="#FDF4EA" stroke="#C2660F"/>
    <text class="s lg" x="947" y="69">human-owned</text>
    <rect x="1048" y="57" width="14" height="14" rx="3" fill="#EEEFFC" stroke="#4B45D0"/>
    <text class="s lg" x="1069" y="69">agent-owned</text>
    <rect x="1170" y="57" width="14" height="14" rx="3" fill="#EAF6F6" stroke="#1B8A8F"/>
    <text class="s lg" x="1191" y="69">coordinated</text>
    <text class="s lgn" x="1268" y="99" text-anchor="end">Columns show who does the work · colour shows who owns the document</text>
  </g>

  <!-- ── column headers ───────────────────────────────────────────────────── -->
  <rect x="218" y="128" width="300" height="34" rx="17" fill="#B4530A"/>
  <text class="s lane" x="368" y="151" text-anchor="middle">YOU — RESEARCH LEAD</text>
  <rect x="550" y="128" width="380" height="34" rx="17" fill="#3F3AC4"/>
  <text class="s lane" x="740" y="151" text-anchor="middle">AGENT FLEET — RESEARCH ASSISTANTS</text>

  <!-- ══ BAND A · HYPOTHESIS ══════════════════════════════════════════════ -->
  <rect x="188" y="178" width="1028" height="320" rx="18" fill="#FFFFFF" stroke="#E4E7ED"/>
  <text class="s bnd" x="208" y="210">STRATEGY</text>
  <text class="s bwh" x="1196" y="210" text-anchor="end">you and the agent, as peers who are expected to disagree</text>
  <rect x="200" y="224" width="336" height="262" rx="12" fill="#FCF8F4"/>
  <rect x="560" y="224" width="644" height="262" rx="12" fill="#F7F7FD"/>

  <!-- step 1 · conjecture -->
  <text class="s phn" x="52" y="276">1</text>
  <text class="s ph"  x="52" y="302">FRAME</text>
  <g>
    <path d="M225,238 H500 L518,256 V323 A7,7 0 0 1 511,330 H225 A7,7 0 0 1 218,323 V245 A7,7 0 0 1 225,238 Z" fill="#FDF4EA" stroke="#C2660F" stroke-width="1.6"/>
    <path d="M500,238 V256 H518 Z" fill="#C2660F" fill-opacity=".22"/>
    <path d="M500,238 V256 H518" fill="none" stroke="#C2660F" stroke-width="1.2"/>
    <text class="s tag" x="238" y="266" fill="#97430A">HUMAN-OWNED</text>
    <text class="s ttl" x="238" y="292">My hypotheses &amp; priors</text>
    <text class="m fn"  x="238" y="316" fill="#97430A">thor-conjectures-human.md</text>
  </g>
  <g>
    <path d="M587,238 H882 L900,256 V323 A7,7 0 0 1 893,330 H587 A7,7 0 0 1 580,323 V245 A7,7 0 0 1 587,238 Z" fill="#EEEFFC" stroke="#4B45D0" stroke-width="1.6"/>
    <path d="M882,238 V256 H900 Z" fill="#4B45D0" fill-opacity=".22"/>
    <path d="M882,238 V256 H900" fill="none" stroke="#4B45D0" stroke-width="1.2"/>
    <text class="s tag" x="600" y="266" fill="#3A35B8">AGENT-OWNED</text>
    <text class="s ttl" x="600" y="292">Agent's hypotheses &amp; priors</text>
    <text class="m fn"  x="600" y="316" fill="#3A35B8">thor-conjectures-agent.md</text>
  </g>
  <path d="M528,284 H570" fill="none" stroke="#7A8290" stroke-width="1.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
  <text class="s cap" x="549" y="348" text-anchor="middle">Two belief files, two owners.</text>
  <text class="s cap" x="549" y="367" text-anchor="middle">The agent is told to push back, not agree.</text>

  <!-- step 5 label · lands here -->
  <text class="s phn" x="930" y="250">5</text>
  <text class="s ph"  x="964" y="250">REFLECT</text>
  <text class="s cap" x="964" y="272">results update beliefs</text>

  <!-- step 2 · plan -->
  <text class="s phn" x="52" y="420">2</text>
  <text class="s ph"  x="52" y="446">PLAN</text>
  <path d="M340,334 V378" fill="none" stroke="#98A0AE" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M760,334 V378" fill="none" stroke="#98A0AE" stroke-width="1.8" marker-end="url(#ah)"/>
  <g>
    <path d="M316,382 H771 L789,400 V467 A7,7 0 0 1 782,474 H316 A7,7 0 0 1 309,467 V389 A7,7 0 0 1 316,382 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M771,382 V400 H789 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M771,382 V400 H789" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s tag" x="329" y="410" fill="#0C5A5E">COORDINATED · AGENT PROPOSES, YOU APPROVE</text>
    <text class="s ttl" x="329" y="436">Ranked agenda of what to do next</text>
    <text class="m fn"  x="329" y="460" fill="#0C5A5E">thor-next-steps.md</text>
  </g>

  <!-- ══ BAND B · EXECUTE ═════════════════════════════════════════════════ -->
  <rect x="188" y="522" width="1028" height="598" rx="18" fill="#FFFFFF" stroke="#E4E7ED"/>
  <text class="s bnd" x="208" y="554">EXECUTE</text>
  <text class="s bwh" x="1196" y="554" text-anchor="end">the agent does the work · you review at both gates</text>
  <rect x="200" y="572" width="336" height="536" rx="12" fill="#FCF8F4"/>
  <rect x="560" y="572" width="644" height="536" rx="12" fill="#F7F7FD"/>

  <path d="M549,474 V659 Q549,671 561,671 H616" fill="none" stroke="#98A0AE" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- step 3 · run -->
  <text class="s phn" x="52" y="663">3</text>
  <text class="s ph"  x="52" y="689">REASON</text>
  <g>
    <path d="M659,580 H1154 L1172,598 V683 A7,7 0 0 1 1165,690 H659 A7,7 0 0 1 652,683 V587 A7,7 0 0 1 659,580 Z" fill="#F6FBFB" stroke="#9CC6C8" stroke-width="1.2"/>
    <path d="M651,589 H1146 L1164,607 V692 A7,7 0 0 1 1157,699 H651 A7,7 0 0 1 644,692 V596 A7,7 0 0 1 651,589 Z" fill="#F4FAFA" stroke="#86BBBD" stroke-width="1.3"/>
    <path d="M643,598 H1138 L1156,616 V701 A7,7 0 0 1 1149,708 H643 A7,7 0 0 1 636,701 V605 A7,7 0 0 1 643,598 Z" fill="#F1F9F9" stroke="#6EB0B3" stroke-width="1.4"/>
    <path d="M635,607 H1130 L1148,625 V710 A7,7 0 0 1 1141,717 H635 A7,7 0 0 1 628,710 V614 A7,7 0 0 1 635,607 Z" fill="#EEF7F7" stroke="#55A5A8" stroke-width="1.5"/>
    <path d="M627,616 H1122 L1140,634 V719 A7,7 0 0 1 1133,726 H627 A7,7 0 0 1 620,719 V623 A7,7 0 0 1 627,616 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M1122,616 V634 H1140 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M1122,616 V634 H1140" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s tag" x="640" y="644" fill="#0C5A5E">COORDINATED · ONE DOCUMENT PER EXPERIMENT</text>
    <text class="s ttl" x="640" y="670">Study: pre-registered plan, then the record</text>
    <text class="m fn"  x="640" y="702" fill="#0C5A5E">thor-study-&lt;name&gt;.md</text>
    <rect x="893" y="684" width="229" height="30" rx="15" fill="#1B8A8F"/>
    <text class="s bdg" x="1008" y="704" text-anchor="middle">10 TO 100 PER PROJECT</text>
  </g>
  <text class="s cap" x="1184" y="746" text-anchor="end">Criteria for success, failure and ambiguity</text>
  <text class="s cap" x="1184" y="764" text-anchor="end">are fixed before the run, not after.</text>

  <!-- your control surface -->
  <g>
    <rect x="218" y="616" width="300" height="218" rx="14" fill="#FFFFFF" stroke="#C2660F" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="s tag" x="238" y="648" fill="#97430A">YOUR CONTROL SURFACE</text>
    <text class="s bul" x="238" y="686">· Set direction. Review next steps</text>
    <text class="s bul" x="238" y="726">· Markdown diffs give a</text>
    <text class="s bul" x="246" y="744">high-level review point</text>
    <text class="s bul" x="238" y="786">· "Push to git" is a</text>
    <text class="s bul" x="246" y="804">detail-level review point</text>
  </g>

  <!-- step 4 · record -->
  <text class="s phn" x="52" y="918">4</text>
  <text class="s ph"  x="52" y="944">RECORD</text>
  <path d="M690,726 V776" fill="none" stroke="#98A0AE" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="580" y="780" width="604" height="292" rx="16" fill="#FFFFFF" stroke="#DDE3EA"/>
  <text class="s grp" x="596" y="810">THE RESULTS TRIO — STRICTLY EMPIRICAL, NO CONJECTURE</text>
  <g>
    <path d="M603,826 H1150 L1168,844 V889 A7,7 0 0 1 1161,896 H603 A7,7 0 0 1 596,889 V833 A7,7 0 0 1 603,826 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M1150,826 V844 H1168 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M1150,826 V844 H1168" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s ttl" x="614" y="858">Results pertinent to current claims</text>
    <text class="m fn"  x="614" y="884" fill="#0C5A5E">thor-results-summary.md</text>
  </g>
  <g>
    <path d="M603,906 H1150 L1168,924 V969 A7,7 0 0 1 1161,976 H603 A7,7 0 0 1 596,969 V913 A7,7 0 0 1 603,906 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M1150,906 V924 H1168 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M1150,906 V924 H1168" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s ttl" x="614" y="938">Append-only ledger of every run</text>
    <text class="m fn"  x="614" y="964" fill="#0C5A5E">thor-results-by-time.md</text>
  </g>
  <g>
    <path d="M603,986 H1150 L1168,1004 V1049 A7,7 0 0 1 1161,1056 H603 A7,7 0 0 1 596,1049 V993 A7,7 0 0 1 603,986 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M1150,986 V1004 H1168 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M1150,986 V1004 H1168" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s ttl" x="614" y="1018">Claims mapped to their evidence</text>
    <text class="m fn"  x="614" y="1044" fill="#0C5A5E">thor-claim-evidence.md</text>
  </g>

  <!-- your review loop -->
  <g>
    <rect x="218" y="858" width="300" height="214" rx="14" fill="#FFFFFF" stroke="#C2660F" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="s tag" x="238" y="888" fill="#97430A">YOUR REVIEW LOOP</text>
    <text class="s bul" x="238" y="926">· Skeptic gate in a fresh thread,</text>
    <text class="s bul" x="246" y="944">before launch and after results</text>
    <text class="s bul" x="238" y="982">· Read the compact summary,</text>
    <text class="s bul" x="246" y="1000">then re-rank the agenda</text>
    <text class="s bul" x="238" y="1038">· Two to many threads at once —</text>
    <text class="s bul" x="246" y="1056">you are the bottleneck, by design</text>
  </g>

  <!-- step 5 · reflect loop, back up into band A -->
  <path d="M1184,926 H1232 Q1244,926 1244,914 V296 Q1244,284 1232,284 H906" fill="none" stroke="#98A0AE" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ══ BAND C · FOUNDATION ══════════════════════════════════════════════ -->
  <path d="M549,1156 V1124" fill="none" stroke="#B0B7C3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
  <text class="s cap" x="569" y="1146">rehydrate: every session starts by reading the contract</text>

  <rect x="188" y="1160" width="1028" height="168" rx="16" fill="#FBFBFD" stroke="#D8DDE6" stroke-dasharray="6 5"/>
  <text class="s bnd" x="208" y="1192">FOUNDATION</text>
  <text class="s bwh" x="1196" y="1192" text-anchor="end">coordinated · written once, read by both, re-read at every session start</text>
  <g>
    <path d="M215,1210 H506 L524,1228 V1301 A7,7 0 0 1 517,1308 H215 A7,7 0 0 1 208,1301 V1217 A7,7 0 0 1 215,1210 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M506,1210 V1228 H524 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M506,1210 V1228 H524" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s tag" x="228" y="1238" fill="#0C5A5E">COORDINATED</text>
    <text class="s ttl" x="228" y="1266">Contract, culture, rehydration</text>
    <text class="m fn"  x="228" y="1292" fill="#0C5A5E">thor-agent.md</text>
  </g>
  <g>
    <path d="M551,1210 H842 L860,1228 V1301 A7,7 0 0 1 853,1308 H551 A7,7 0 0 1 544,1301 V1217 A7,7 0 0 1 551,1210 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M842,1210 V1228 H860 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M842,1210 V1228 H860" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s tag" x="564" y="1238" fill="#0C5A5E">COORDINATED</text>
    <text class="s ttl" x="564" y="1266">One canonical vocabulary</text>
    <text class="m fn"  x="564" y="1292" fill="#0C5A5E">thor-glossary.md</text>
  </g>
  <g>
    <path d="M887,1210 H1178 L1196,1228 V1301 A7,7 0 0 1 1189,1308 H887 A7,7 0 0 1 880,1301 V1217 A7,7 0 0 1 887,1210 Z" fill="#EAF6F6" stroke="#1B8A8F" stroke-width="1.6"/>
    <path d="M1178,1210 V1228 H1196 Z" fill="#1B8A8F" fill-opacity=".22"/>
    <path d="M1178,1210 V1228 H1196" fill="none" stroke="#1B8A8F" stroke-width="1.2"/>
    <text class="s tag" x="900" y="1238" fill="#0C5A5E">COORDINATED</text>
    <text class="s ttl" x="900" y="1266">What each document is for</text>
    <text class="m fn"  x="900" y="1292" fill="#0C5A5E">thor-document-rules.md</text>
  </g>
</svg>
